name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Check out compatible Console host
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: cofy-x/dsh-console
          ref: 225388ec53cd40a8ea1a82e896fc831a44eb3209
          path: _console
          fetch-depth: 1
      - name: Install pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.24.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile
      - name: Build compatible Console host
        run: |
          pnpm --dir _console install --frozen-lockfile
          pnpm --dir _console run build:cli
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Verify tarball and isolated install
        run: pnpm test:package
      - name: Verify Console host integration
        run: pnpm test:integration:host
        env:
          DSH_CONSOLE_ROOT: ${{ github.workspace }}/_console

  latest-dsh-source:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out trajectory plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Check out compatible Console host
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: cofy-x/dsh-console
          ref: 225388ec53cd40a8ea1a82e896fc831a44eb3209
          path: _console
          fetch-depth: 1
      - name: Check out audited DSH release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: deepseek-ai/DeepSeek-Harness
          ref: cd5ef8148158c3a752a658978873241fdf8e2bbc
          path: _dsh-source
          fetch-depth: 1
      - name: Install pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.24.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Install plugin dependencies from lockfile
        run: pnpm install --frozen-lockfile
      - name: Install Console dependencies from lockfile
        run: pnpm --dir _console install --frozen-lockfile
      - name: Build audited DSH source release
        run: |
          pnpm --dir _dsh-source install --frozen-lockfile
          pnpm --dir _dsh-source run build
      - name: Select audited DSH source runtime
        run: node scripts/use-dsh-source.mjs _dsh-source
      - name: Select audited DSH source runtime for Console
        working-directory: _console
        run: node scripts/use-dsh-source.mjs ../_dsh-source
      - name: Build compatible Console host
        run: pnpm --dir _console run build:cli
      - name: Verify plugin against latest DSH source release
        run: |
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm test:integration:host
        env:
          DSH_CONSOLE_ROOT: ${{ github.workspace }}/_console
